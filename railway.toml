# Railway configuration for Evora API
# Build: uses root Dockerfile (Node 22, multi-stage, no secrets baked in)
# Migrations: run as releaseCommand before each deploy

[build]
# Railway auto-detects the root Dockerfile — no builder override needed
# buildCommand is empty because CMD in Dockerfile handles startup

[deploy]
# Migrations use DIRECT_URL (bypasses session pooler, no connection limit)
# App server uses DATABASE_URL (session pooler is fine for normal queries)
releaseCommand = "cd apps/api && DATABASE_URL=\"$DIRECT_URL\" npx prisma migrate deploy --schema=prisma/schema.prisma"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
