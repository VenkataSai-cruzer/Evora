# Railway configuration for Evora API
# Node 22 + workspace-aware build

[build]
builder = "nixpacks"
# Root npm ci installs ALL workspace deps including devDeps needed for tsc.
# We don't run npm install again inside apps/api — that breaks workspace resolution.
buildCommand = "npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build:api"

[deploy]
# Migration runs as releaseCommand (pre-deploy, isolated connection)
# App starts clean with no migration overhead competing for connections
startCommand = "cd apps/api && node dist/server.js"
releaseCommand = "cd apps/api && npx prisma migrate deploy --schema=prisma/schema.prisma"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
