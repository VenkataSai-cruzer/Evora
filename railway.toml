# Railway configuration for Evora API
# Build: uses root Dockerfile (Node 22, multi-stage, no secrets baked in)
# Migrations: run as releaseCommand before each deploy

[build]
# Railway auto-detects the root Dockerfile — no builder override needed
# buildCommand is empty because CMD in Dockerfile handles startup

[deploy]
# Prisma now uses DATABASE_URL for everything (directUrl removed from schema).
# We override DATABASE_URL with ?pgbouncer=true so the migration engine emits
# PgBouncer-compatible SQL and minimizes connections through the pooler.
# Railway cannot reach Supabase's direct port, so all traffic goes via pooler.
# The wrapper script preps the URL and runs the migration.
releaseCommand = "cd apps/api && node scripts/run-migration.mjs"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 0  # Avoid cascading connection leaks on retry
