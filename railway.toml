# Railway configuration for Evora API
# Build: uses root Dockerfile (Node 22, multi-stage, no secrets baked in)
# Migrations: run as releaseCommand before each deploy

[build]
# Railway auto-detects the root Dockerfile — no builder override needed
# buildCommand is empty because CMD in Dockerfile handles startup

[deploy]
# Prisma migration engine reads `directUrl` from the schema, so we must
# override DIRECT_URL (not DATABASE_URL). Railway cannot reach Supabase's
# direct IPv6 port, so we reuse DATABASE_URL (pooler) with:
#   connection_limit=1 → avoids exhausting pooler's 15-connection limit
#   pgbouncer=true     → emits PgBouncer-compatible SQL
releaseCommand = "cd apps/api && DIRECT_URL=\"${DATABASE_URL}?connection_limit=1&pgbouncer=true\" npx prisma migrate deploy --schema=prisma/schema.prisma"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
