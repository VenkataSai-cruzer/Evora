# Railway configuration for Evora API
# Build: uses root Dockerfile (Node 22, multi-stage, no secrets baked in)
# Migrations: run as releaseCommand before each deploy

[build]
# Railway auto-detects the root Dockerfile — no builder override needed
# buildCommand is empty because CMD in Dockerfile handles startup

[deploy]
# Run migrations BEFORE the app starts (isolated, before server connections open)
releaseCommand = "cd apps/api && npx prisma migrate deploy --schema=prisma/schema.prisma"
# CMD in Dockerfile already runs: node apps/api/dist/server.js
# startCommand override not needed — leave Railway to use Dockerfile CMD
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
