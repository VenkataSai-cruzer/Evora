# Railway configuration for Evora API
# Build: uses root Dockerfile (Node 22, multi-stage, no secrets baked in)
# Migrations: run as releaseCommand before each deploy

[build]
# Railway auto-detects the root Dockerfile — no builder override needed
# buildCommand is empty because CMD in Dockerfile handles startup

[deploy]
# Migrations run using DATABASE_URL (not DIRECT_URL) because Railway cannot
# reach Supabase's direct IPv6 port 5432. The pooler on port 6543 handles
# both application queries AND migrations when ?pgbouncer=true is omitted.
# Set DATABASE_URL to Supabase pooler connection:
#   postgresql://postgres.REF:PASSWORD@aws-0-region.pooler.supabase.com:6543/postgres
#
# connection_limit=1 prevents Prisma from opening multiple connections and
# exhausting the pooler's 15-connection limit (EMAXCONNSESSION).
releaseCommand = "cd apps/api && DATABASE_URL=\"${DATABASE_URL}?connection_limit=1&pgbouncer=true\" npx prisma migrate deploy --schema=prisma/schema.prisma"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
